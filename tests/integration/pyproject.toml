[project]
name = "moatd-integration"
version = "0.1.0"
description = "Network-namespace integration tests for the moatd firewall"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "scapy>=2.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "perf: performance characterization, slower and opt-in (deselect with -m 'not perf')",
    "scapy: crafts raw packets, needs scapy",
]
