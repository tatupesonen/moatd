[workspace]
resolver = "2"
members = ["moat-common", "moat", "moat-ebpf"]
default-members = ["moat-common", "moat"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
moat-common = { path = "moat-common" }
aya = "0.13"
aya-log = "0.2"
aya-build = "0.1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "signal", "macros", "io-util", "fs", "sync", "time"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
sd-notify = "0.4"
nix = { version = "0.29", features = ["fs", "user", "socket"] }
rtnetlink = "0.14"
netlink-packet-route = "0.21"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
cargo_metadata = "0.23"
which = { version = "8", default-features = false, features = ["real-sys"] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.release.package.moat-ebpf]
debug = 2
codegen-units = 1
